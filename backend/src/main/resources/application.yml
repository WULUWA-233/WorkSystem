server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: crm-system
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.crm.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

knife4j:
  enable: true
  setting:
    language: zh-CN

logging:
  level:
    com.crm: debug
    org.springframework.security: warn

app:
  jwt:
    secret: ${JWT_SECRET:crm-system-jwt-secret-key-2024-min-length-256-bits!!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
